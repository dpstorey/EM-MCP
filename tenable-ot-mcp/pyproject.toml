[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tenable-ot-mcp"
version = "0.5.3"
description = "Open-source MCP server exposing Tenable OT Security data to AI clients."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "John Walley", email = "jwalley@1clearpath.com" },
]
maintainers = [
    { name = "John Walley", email = "jwalley@1clearpath.com" },
    { name = "Dominic Storey", email = "dstorey@barossafarm.com"},
]
keywords = ["mcp", "tenable", "ot-security", "ics", "scada"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "mcp[cli]>=1.28,<2",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "starlette>=0.37",
    "cryptography>=43",
    "click>=8.1",
    "jinja2>=3.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://gitlab.com/jwalley/tenable-ot-mcp"
Repository = "https://gitlab.com/jwalley/tenable-ot-mcp"
Issues = "https://gitlab.com/jwalley/tenable-ot-mcp/-/issues"

[project.scripts]
tenable-ot-mcp = "tenable_ot_mcp.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/tenable_ot_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S"]
ignore = [
    "S101",  # assert is fine; pytest needs it
    "S104",  # 0.0.0.0 is the correct default for a containerized server
    "S105",  # token_label string equality in tests, not a password
    "S106",  # `token_label="read"`/`"write"` are labels, not passwords;
             # test fixtures are intentionally literal
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
