services:
  tenable-ot:
    container_name: tot-mcp

    build:
      context: ./tenable-ot-mcp

    image: tenable-ot-mcp:local

    ports:
      - "3308:40443"

    environment:
      MCP_TLS_DISABLE: "1"

    volumes:
      - ./tenable-ot-mcp-data:/data

    # TLS terminates at the reverse proxy in this deployment, so the
    # container-local health check must use its plain-HTTP listener.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:40443/healthz', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    restart: unless-stopped
