services:
  api:
    environment:
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
      - LIBRECHAT_CODE_BASEURL=http://code_api:3112/v1
      - LIBRECHAT_CODE_API_KEY=dummy
      - MONGO_URI=mongodb://chat-mongodb:27017/LibreChat
      - MEILI_HOST=http://chat-meilisearch:7700
    volumes:
      - type: bind
        source: /etc/ssl/certs/ca-certificates.crt
        target: /etc/ssl/certs/ca-certificates.crt
        read_only: true
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - type: bind
        source: /home/dstorey/llm-scratch
        target: /llm-scratch
    ulimits:
      nofile: 65536
    restart: unless-stopped

  workspace-shell-mcp:
    build:
      context: ../mcp-shell
      dockerfile: Dockerfile
    container_name: workspace-shell-mcp
    restart: unless-stopped

    volumes:
      - /home/dstorey/llm-scratch:/llm-scratch

    environment:
      WORKSPACE: /llm-scratch
      COMMAND_TIMEOUT: "120"
      MAX_OUTPUT: "100000"

    # Prevent privilege escalation.
    security_opt:
      - no-new-privileges:true

    # Drop every Linux capability.
    cap_drop:
      - ALL

    # Root filesystem is immutable; only /llm-scratch and tmpfs are writable.
    read_only: true

    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run:size=16m,mode=0755

    # Reasonable protection against fork bombs and runaway processes.
    pids_limit: 128

    mem_limit: 2g
    cpus: 2.0

    networks:
      - default



